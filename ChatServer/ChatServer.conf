# AIChatServer 配置文件示例
# 使用: ./AIChatServer --flagfile=ChatServer.conf
# 命令行参数优先于本配置文件中的同名参数
# API Key 通过环境变量提供: deepseek_apikey / chatgpt_apikey / KIMI_API_KEY

--host=0.0.0.0
--port=8080
--log_level=INFO
--temperature=0.7
--max_tokens=2048
--deepseek_model=deepseek-flash
--chatgpt_model=gpt-5.5
--kimi_model=kimi-k2.6
--ollama_model=deepseek-r1:1.5b
--ollama_model_desc=本地 Ollama 模型
--ollama_endpoint=http://127.0.0.1:11434
--ollama_num_ctx=2048