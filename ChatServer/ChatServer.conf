# AIChatServer 配置文件
# 用法: ./AIChatServer --flagfile=ChatServer.conf
# 每行一个参数，格式为 --flag=value，以 # 开头的行为注释

# 服务器监听地址与端口
--host=0.0.0.0
--port=8080

# 日志级别: TRACE/DEBUG/INFO/WARNING/ERROR/CRITICAL/OFF
--log_level=INFO

# 模型采样参数
--temperature=0.7
--max_tokens=2048

# Ollama 本地模型配置（安全检查要求不能为空）
--ollama_model_name=deepseek-r1:1.5b
--ollama_model_desc=本地部署的DeepSeek-R1蒸馏模型
--ollama_endpoint=127.0.0.1:11434
