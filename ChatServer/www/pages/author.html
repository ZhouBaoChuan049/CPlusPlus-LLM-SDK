<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作者介绍 - EchoMind</title>
    <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/css/author.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="nav-title">欢迎来到-EchoMind</div>
        <button class="back-btn" id="back-btn" type="button">回到</button>
    </header>

    <!-- 页面主体 -->
    <main class="container">
        <!-- 作者个人信息区 -->
        <section class="author">
            <img class="avatar" src="/images/profile.jpg" alt="作者头像">
            <h1 class="author-name">小此方</h1>
        </section>

        <!-- 展示卡片区 -->
        <section class="cards">
            <article class="card">
                <h2 class="card-title">关于我</h2>
                <div class="card-body"></div>
            </article>

            <article class="card">
                <h2 class="card-title">关于本项目</h2>
                <div class="card-body"></div>
            </article>

            <article class="card">
                <h2 class="card-title">联系</h2>
                <div class="card-body"></div>
            </article>
        </section>
    </main>

    <script src="/js/author.js"></script>
</body>
</html>
