<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoMind AI</title>
    <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>
    <div class="overlay"></div>

    <nav class="navbar">
        <div class="nav-left">
            <img class="logo" src="/images/logo.jpg" alt="EchoMind Logo">
            <span class="brand">EchoMind AI</span>
        </div>
        <div class="nav-right">
            <a class="nav-link" href="https://github.com/ZhouBaoChuan049/CPlusPlus_LLM_SDK" target="_blank" rel="noopener">源码</a>
        </div>
    </nav>

    <main class="hero">
        <h1 class="title">Welcome To EchoMind</h1>

        <p class="typewriter">
            <span id="typewriter-text"></span><span class="caret"></span>
        </p>

        <div class="input-card">
            <textarea id="question" rows="3" placeholder="你在此端发问，我在彼端回答。"></textarea>
            <button id="send-btn" class="send-btn" type="button" aria-label="发送" title="发送">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <button id="start-btn" class="start-btn" type="button">开始体验</button>

        <!-- 功能预告胶囊（不可点击，仅展示能力） -->
        <div class="feature-pills">
            <div class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/><path d="M8 11l2 2 3-3 3 3"/>
                </svg>
                <span>PPT</span>
            </div>
            <div class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
                </svg>
                <span>深度研究</span>
            </div>
            <div class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>
                </svg>
                <span>文档</span>
            </div>
            <div class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M13 4l-2 16"/>
                </svg>
                <span>构建应用</span>
            </div>
            <div class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
                </svg>
                <span>表格</span>
            </div>
            <div class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
                </svg>
                <span>设计</span>
            </div>
        </div>
    </main>

    <script src="/js/home.js"></script>
</body>
</html>
